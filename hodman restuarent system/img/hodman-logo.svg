<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hodmanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="hodmanGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e40af" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="250" cy="250" r="236" fill="#ffffff" stroke="#1e3a8a" stroke-width="8"/>
  <circle cx="250" cy="250" r="222" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- Hodman Script Brand Text -->
  <g transform="translate(60, 240)">
    <text x="0" y="0" font-family="'Playfair Display', 'Georgia', serif" font-weight="900" font-size="64" fill="#1e3a8a" letter-spacing="-1">Hodman</text>
    <text x="4" y="32" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="800" font-size="11" fill="#d97706" letter-spacing="3.5">RESTAURANT HALLS &amp; CAFETERIA</text>
  </g>

  <!-- Winged Heart Emblem Group -->
  <g transform="translate(340, 230) scale(0.95)" filter="url(#subtleGlow)">
    <!-- Left Wing -->
    <g fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.5">
      <!-- Upper Feathers -->
      <path d="M-20,-10 C-45,-55 -85,-75 -115,-70 C-110,-45 -95,-20 -70,-5 C-85,-5 -105,10 -100,30 C-85,32 -65,22 -45,12 C-60,25 -70,45 -55,55 C-42,52 -30,35 -15,22 Z" fill="#ffffff" stroke="#1e3a8a" stroke-width="4"/>
      <path d="M-30,-15 C-50,-45 -80,-60 -102,-56 C-92,-38 -78,-18 -55,-5" fill="none" stroke="#1e3a8a" stroke-width="3"/>
      <path d="M-40,5 C-60,-5 -80,10 -85,22 C-70,22 -55,15 -35,8" fill="none" stroke="#1e3a8a" stroke-width="2.5"/>
      <path d="M-30,22 C-45,28 -55,42 -44,48 C-35,42 -25,30 -15,22" fill="none" stroke="#1e3a8a" stroke-width="2.5"/>
    </g>

    <!-- Right Wing -->
    <g fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.5">
      <!-- Upper Feathers -->
      <path d="M20,-10 C45,-55 85,-75 115,-70 C110,-45 95,-20 70,-5 C85,-5 105,10 100,30 C85,32 65,22 45,12 C60,25 70,45 55,55 C42,52 30,35 15,22 Z" fill="#ffffff" stroke="#1e3a8a" stroke-width="4"/>
      <path d="M30,-15 C50,-45 80,-60 102,-56 C92,-38 78,-18 55,-5" fill="none" stroke="#1e3a8a" stroke-width="3"/>
      <path d="M40,5 C60,-5 80,10 85,22 C70,22 55,15 35,8" fill="none" stroke="#1e3a8a" stroke-width="2.5"/>
      <path d="M30,22 C45,28 55,42 44,48 C35,42 25,30 15,22" fill="none" stroke="#1e3a8a" stroke-width="2.5"/>
    </g>

    <!-- Center Heart with Wing Joints -->
    <path d="M0,45 C-42,12 -52,-20 -28,-42 C-10,-58 0,-30 0,-20 C0,-30 10,-58 28,-42 C52,-20 42,12 0,45 Z" fill="url(#hodmanBlueGrad)" stroke="#1e3a8a" stroke-width="3"/>
    
    <!-- Heart Inner Highlight -->
    <path d="M-8,-25 C-18,-36 -24,-30 -22,-20 C-20,-8 -10,8 -2,22" fill="none" stroke="#93c5fd" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
